<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    table, th, td {
  border: 3px double black; 
  border-collapse: collapse;
    padding: 5px;
        }
    body {
      font-family: Arial, sans-serif;
    }
    table {
      width: 500px;
      margin: 20px auto;
    }
    th {
      text-align: center;
      font-size: 20px;
      padding: 10px;
    }
    td {
      border: 1px double black;
      padding: 8px;
    }
    input[type="text"], input[type="password"], textarea, select {
      width: 40%;
      padding: 5px;
    }
    .buttons {
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <form>
        <table>
        <tr>
        <th colspan="2">ĐĂNG KÝ</th>
        </tr>
        <tr>
            <td>Họ tên</td>
            <td><input type="text" name="fullname" placeholder="Nhập họ tên"></td>
        </tr>
        <tr>
            <td>Username</td>
            <td><input type="text" name="username" placeholder="Nhập tên đăng nhập"></td>
        </tr>
        <tr>
            <td>Mật khẩu</td>
            <td><input type="password" name="password" placeholder="Mật khẩu"></td>
        </tr>
        <tr>
            <td>Nhập lại Mật khẩu</td>
            <td><input type="password" name="re_password" placeholder="Nhập lại Mật khẩu"></td>
        </tr>
        <tr>
            <td>Giới tính</td>
            <td>
            <input type="radio" name="gender" id="male" value="male" checked> 
            <label for="male">Nam</label>

            <input type="radio" name="gender" id="female" value="female"> 
            <label for="female">Nữ</label>

            <input type="radio" name="gender" id="other" value="other"> 
            <label for="other">Khác</label>
            </td>
        </tr>
        <tr>
            <td>Ngày sinh</td>
            <td>
            <select name="day">
                    <option>01</option>
                    <option>02</option>
                    <option>03</option>
                    <option>04</option>
                    <option>05</option>
                    <option>06</option>
                    <option>07</option>
                    <option>08</option>
                    <option>09</option>
                    <option>10</option>
                    <option>11</option>
                    <option>12</option>
                    <option>13</option>
                    <option>14</option>
                    <option>15</option>
                    <option>16</option>
                    <option>17</option>
                    <option>18</option>
                    <option>19</option>
                    <option>20</option>
                    <option>21</option>
                    <option>22</option>
                    <option>23</option>
                    <option>24</option>
                    <option>25</option>
                    <option>26</option>
                    <option>27</option>
                    <option>28</option>
                    <option>29</option>
                    <option>30</option>
                    <option>31</option>
            </select>
            <select name="month">
                    <option>01</option>
                    <option>02</option>
                    <option>03</option>
                    <option>04</option>
                    <option>05</option>
                    <option>06</option>
                    <option>07</option>
                    <option>08</option>
                    <option>09</option>
                    <option>10</option>
                    <option>11</option>
                    <option>12</option>
            </select>
            <select name="year">
                    <option>2001</option>
                    <option>2002</option>
                    <option>2003</option>
                    <option>2004</option>
                    <option>2005</option>
                    <option>2006</option>
                    <option>2007</option>
                    <option>2008</option>
                    <option>2009</option>
                    <option>2010</option>
                    <option>2011</option>
                    <option>2012</option>
                    <option>2013</option>
                    <option>2014</option>
                    <option>2015</option>
                    <option>2016</option>
                    <option>2017</option>
                    <option>2018</option>
                    <option>2019</option>
                    <option>2020</option>
                    <option>2021</option>
                    <option>2022</option>
                    <option>2023</option>
                    <option>2024</option>
                    <option>2025</option>
            </select>
            </td>
        </tr>
        <tr>
            <td>Địa chỉ</td>
            <td><textarea name="address" cols="30" rows="5"></textarea></td>
        </tr>
        <tr>
            <td>Avatar</td>
            <td><input type="file" name="avatar"></td>
        </tr>
        <tr>
            <td>Sở thích</td>
            <td>
                <input type="checkbox" id="movie" name="hobby_movie" value="movie">
                <label for="movie">Xem phim</label>

                <input type="checkbox" id="sport" name="hobby_sport" value="sport">
                <label for="sport">Thể thao</label>

                <input type="checkbox" id="game" name="hobby_game" value="game">
                <label for="game">Trò chơi</label>
            </td>
        </tr>
        <tr>
                <td colspan="2" class="buttons">
                <input type="reset" value="Reset">
                <input type="submit" value="Ok">
            </td>
        </tr>
        </table>
    </form>
   </div>
</body>
</html>
